name: SmallRye Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'NOTICE'
      - 'README*'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'NOTICE'
      - 'README*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    name: build with jdk ${{matrix.java}}

    steps:
      - uses: actions/checkout@v5
        name: checkout

      - uses: actions/setup-java@v5
        name: set up jdk ${{matrix.java}}
        with:
          distribution: 'temurin'
          java-version: ${{matrix.java}}
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: build with maven
        run: mvn -B formatter:validate install --file pom.xml

      - uses: actions/checkout@v5
        name: checkout smallrye-config
        with:
          repository: smallrye/smallrye-config
          path: smallrye-config

      - name: test with smallrye-config
        run: |
          cd smallrye-config
          mvn versions:update-property -Dproperty=version.smallrye.testing -DallowSnapshots=true -N
          git diff pom.xml
          mvn install

      - uses: actions/checkout@v5
        name: checkout smallrye-opentelemetry
        with:
          repository: smallrye/smallrye-opentelemetry
          path: smallrye-opentelemetry

#      Requires update to SmallRye OpenTelemetry
#      - name: test with smallrye-opentelemetry
#        run: |
#          cd smallrye-opentelemetry
#          mvn versions:update-property -Dproperty=version.smallrye.testing -DallowSnapshots=true -N
#          git diff pom.xml
#          mvn install

  quality:
    needs: [build]
    if: github.event_name == 'push' && github.repository_owner == 'smallrye'
    runs-on: ubuntu-latest
    name: quality

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: build with docs and coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: | 
          mvn verify -Pcoverage javadoc:javadoc
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Psonar -Dsonar.token="$SONAR_TOKEN"
